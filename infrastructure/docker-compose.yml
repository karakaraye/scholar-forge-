# ScholarForge AI - production-style stack
#
#   cp infrastructure/.env.example infrastructure/.env   # then fill in the values
#   cd infrastructure && docker compose up --build -d
#
# Only the Caddy proxy is published (ports 80/443). It serves the Next.js app and routes
# /api/, /admin/ and /static/ to Django, so browser and API share one origin.

name: scholarforge

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scholarforge_db}
      POSTGRES_USER: ${POSTGRES_USER:-scholarforge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # One-off release step: apply migrations and seed reference data, then exit.
  migrate:
    build: &backend_build
      context: ../backend
      dockerfile: ../infrastructure/backend.Dockerfile
    image: scholarforge-backend:latest
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_disciplines"
    environment: &backend_env
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in infrastructure/.env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      SESSION_COOKIE_SECURE: ${COOKIES_SECURE:-True}
      CSRF_COOKIE_SECURE: ${COOKIES_SECURE:-True}
      # Caddy already redirects HTTP to HTTPS for real domains.
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-scholarforge_db}
      POSTGRES_USER: ${POSTGRES_USER:-scholarforge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_MEDIA_ROOT: /app/media
      EXPORT_JOB_MODE: worker
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-ScholarForge AI <no-reply@scholarforge.ai>}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-False}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  backend:
    image: scholarforge-backend:latest
    build: *backend_build
    restart: unless-stopped
    environment: *backend_env
    volumes:
      - mediadata:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  # Renders queued DOCX/PDF exports outside the web request.
  worker:
    image: scholarforge-backend:latest
    build: *backend_build
    restart: unless-stopped
    command: python manage.py run_export_worker
    environment: *backend_env
    volumes:
      - mediadata:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    networks: [internal]

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/frontend.Dockerfile
      args:
        # Empty = same origin (recommended). Only set this if the API lives on another origin.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: scholarforge-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    networks: [internal]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  mediadata:
  caddy_data:
  caddy_config:
